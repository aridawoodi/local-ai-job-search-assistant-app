<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Practice apply form — Job Search Assistant</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; margin-top: 0.75rem; font-weight: 600; }
      input, textarea, select { width: 100%; padding: 0.4rem; margin-top: 0.25rem; }
      button { margin-top: 1.25rem; padding: 0.5rem 1rem; }
      .hint { color: #555; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <h1 id="job-title">Practice Software Engineer</h1>
    <p id="job-company">Demo Company</p>
    <p class="hint">
      Offline Greenhouse-like form for apply-fill demos. Autofill must never press Submit.
    </p>
    <form id="application-form" action="#" method="post" onsubmit="alert('Submit clicked — autofill should never reach here'); return false;">
      <label for="first_name">First name</label>
      <input id="first_name" name="first_name" autocomplete="given-name" />

      <label for="last_name">Last name</label>
      <input id="last_name" name="last_name" autocomplete="family-name" />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" />

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" />

      <label for="linkedin">LinkedIn</label>
      <input id="linkedin" name="linkedin" />

      <label for="location">Location</label>
      <input id="location" name="location" autocomplete="address-level2" />

      <label for="current_title">Current job title</label>
      <input id="current_title" name="current_title" autocomplete="organization-title" />

      <label for="current_company">Current company</label>
      <input id="current_company" name="current_company" autocomplete="organization" />

      <label for="years">Years of experience</label>
      <input id="years" name="years" />

      <label for="sponsorship">Will you need visa sponsorship?</label>
      <select id="sponsorship" name="sponsorship">
        <option value="">Select…</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <label for="cover">Cover letter</label>
      <textarea id="cover" name="cover" rows="4"></textarea>

      <label for="gender">Gender (voluntary)</label>
      <select id="gender" name="gender">
        <option value="">Decline to self-identify</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Non-binary">Non-binary</option>
      </select>

      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
