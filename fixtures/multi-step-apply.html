<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Multi-step apply practice — Job Search Assistant</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; margin-top: 0.75rem; font-weight: 600; }
      input, select, textarea { width: 100%; padding: 0.4rem; margin-top: 0.25rem; }
      button { margin-top: 1rem; margin-right: 0.4rem; padding: 0.5rem 1rem; }
      .panel { display: none; }
      .panel.active { display: block; }
      .hint { color: #555; font-size: 0.9rem; }
      .progress { color: #4f46e5; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Multi-step practice application</h1>
    <p class="hint">Generic ATS wizard: Contact → Experience → Review. Used to exercise step sessions.</p>
    <p class="progress" id="progress">Step 1 of 3</p>

    <form id="application-form" onsubmit="alert('Final submit'); return false;">
      <div class="panel active" data-panel="1">
        <label for="first_name">First name</label>
        <input id="first_name" name="first_name" autocomplete="given-name" />
        <label for="last_name">Last name</label>
        <input id="last_name" name="last_name" autocomplete="family-name" />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" />
        <button type="button" id="to-2">Continue</button>
      </div>

      <div class="panel" data-panel="2">
        <label for="current_title">Current job title</label>
        <input id="current_title" name="current_title" autocomplete="organization-title" />
        <label for="current_company">Current company</label>
        <input id="current_company" name="current_company" autocomplete="organization" />
        <label for="years">Years of experience</label>
        <input id="years" name="years" />
        <button type="button" id="back-1">Back</button>
        <button type="button" id="to-3">Next</button>
      </div>

      <div class="panel" data-panel="3">
        <label for="location">Location</label>
        <input id="location" name="location" />
        <label for="linkedin">LinkedIn</label>
        <input id="linkedin" name="linkedin" />
        <button type="button" id="back-2">Back</button>
        <button type="submit">Submit application</button>
      </div>
    </form>

    <script>
      function show(n) {
        document.querySelectorAll('.panel').forEach((el) => {
          el.classList.toggle('active', el.getAttribute('data-panel') === String(n))
        })
        document.getElementById('progress').textContent = 'Step ' + n + ' of 3'
      }
      document.getElementById('to-2').onclick = () => show(2)
      document.getElementById('to-3').onclick = () => show(3)
      document.getElementById('back-1').onclick = () => show(1)
      document.getElementById('back-2').onclick = () => show(2)
    </script>
  </body>
</html>
